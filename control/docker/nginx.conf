server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Vue history mode: /pilot-login etc. must resolve to index.html.
    # no-cache: the browser and the Pilot 2 WebView revalidate index.html on every load. Without it the
    # RC WebView kept the old index.html after a redeploy and requested asset names that no longer
    # existed (2026-10-15: media settings page did not open).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    # Vite assets carry a content hash in the name: cache them for good, and answer a missing one with
    # 404 instead of index.html (a stale page then fails clearly rather than loading HTML as a module).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Offline basemaps (mapping-tool/basemaps/fetch-basemap.sh -> edge/data/basemaps, mounted read-only).
    # The browser reads single tiles out of the .pmtiles file with HTTP range requests (nginx default).
    location /basemaps/ {
        alias /usr/share/nginx/basemaps/;
        types { application/vnd.pmtiles pmtiles; application/json json; }
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
