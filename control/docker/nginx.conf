server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Vue history mode: /pilot-login etc. must resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Offline basemaps (mapping-tool/basemaps/fetch-basemap.sh -> edge/data/basemaps, mounted read-only).
    # The browser reads single tiles out of the .pmtiles file with HTTP range requests (nginx default).
    location /basemaps/ {
        alias /usr/share/nginx/basemaps/;
        types { application/vnd.pmtiles pmtiles; application/json json; }
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
