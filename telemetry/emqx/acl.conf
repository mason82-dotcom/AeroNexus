%% AeroNexus EMQX authorization (mounted over /opt/emqx/etc/acl.conf). The final {deny, all} denies
%% everything not listed; do not remove it.
%% The backend user is a superuser (auth-bootstrap.csv) and is not checked against these rules.
%% Pilot 2 accounts (RC Pro, RC Plus 2) speak the DJI Cloud API as a DEVICE:
%%   publish   device -> cloud: osd, state, events, requests, services_reply, property/set_reply, drc/up, status
%%   subscribe cloud -> device: services, property/set, drc/down and the *_reply of events/requests/state/status
%%   network/probe: subscribed by Pilot 2 on the RC (seen 2026-10-02), not used by the DJI demo backend
%% So a leaked pilot password cannot send commands as the server or read other devices' telemetry.
%% Rules are matched top down, the first match wins.

%% Read-only display (Freenove companion board): may only READ aircraft/RC telemetry (osd). Not status:
%% update_topo carries device_secret and nonce, which a display must not see.
%% Explicit denies first: the generic rules below would otherwise let it publish osd/state (fake
%% telemetry) or subscribe to the command topics (services, drc/down).
{deny,  {username, "companion"}, publish,   ["#"]}.
{allow, {username, "companion"}, subscribe, ["thing/product/+/osd"]}.
{deny,  {username, "companion"}, subscribe, ["#"]}.
%% Dedicated AeroNexus OSD observer: subscribe only, never publish.
%% This account must be created separately as a NON-superuser in EMQX.
%% Keep these explicit denies before the generic allow rules.
{deny,  {username, "aeronexus_osd"}, publish,   ["#"]}.
{allow, {username, "aeronexus_osd"}, subscribe, ["thing/product/+/osd"]}.
{deny,  {username, "aeronexus_osd"}, subscribe, ["#"]}.
%% local diagnostics (emqx ctl, dashboard)
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.
{allow, {ipaddr, "127.0.0.1"}, all, ["$SYS/#", "#"]}.

{allow, all, publish, [
    "thing/product/+/osd",
    "thing/product/+/state",
    "thing/product/+/events",
    "thing/product/+/requests",
    "thing/product/+/services_reply",
    "thing/product/+/property/set_reply",
    "thing/product/+/drc/up",
    "sys/product/+/status",
    "sys/product/+/network/probe_reply"
]}.

{allow, all, subscribe, [
    "thing/product/+/services",
    "thing/product/+/property/set",
    "thing/product/+/drc/down",
    "thing/product/+/events_reply",
    "thing/product/+/requests_reply",
    "thing/product/+/state_reply",
    "sys/product/+/status_reply",
    "sys/product/+/network/probe"
]}.

{deny, all}.
