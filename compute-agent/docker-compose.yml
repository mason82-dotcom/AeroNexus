# AeroNexus compute agent for an x64 node (Linux or Windows/WSL2 with Docker).
# CPU:  docker compose up -d --build
# GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
name: aeronexus-compute

services:
  nodeodm:
    # NodeODM 3.6.2 (AGPL-3.0), unmodified, only reachable inside this stack (+ localhost for debugging)
    image: opendronemap/nodeodm:3.6.2@sha256:fcd99eb23d8db194a7d1dc95f029f518283b3d6be32dd64422395f4e7af56720
    command: ["--token", "${NODEODM_TOKEN}", "--max_images", "${MAX_IMAGES:-200}", "--cleanup_tasks_after", "1440"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - nodeodm-data:/var/www/data

  agent:
    build:
      context: ..
      dockerfile: compute-agent/agent/Dockerfile
    image: aeronexus/compute-agent:local
    restart: unless-stopped
    environment:
      PI_URL: ${PI_URL}
      MAPPING_AGENT_TOKEN: ${MAPPING_AGENT_TOKEN}
      AGENT_ID: ${AGENT_ID}
      NODEODM_URL: http://nodeodm:3000
      NODEODM_TOKEN: ${NODEODM_TOKEN}
      MAX_IMAGES: ${MAX_IMAGES:-200}
      TARGET_CRS: ${TARGET_CRS:-EPSG:25832}
      LEASE_SECONDS: ${LEASE_SECONDS:-600}
      POLL_SECONDS: ${POLL_SECONDS:-20}
      GPU: "false"
    volumes:
      - agent-work:/work
    depends_on:
      - nodeodm

volumes:
  nodeodm-data:
  agent-work:
