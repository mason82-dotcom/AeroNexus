# AeroNexus Edge - local / Raspberry Pi installation of the AeroNexus stack
# Run ./setup.sh first (clones + patches upstream, renders secrets), then: docker compose up -d --build
name: aeronexus-edge

x-restart: &restart
  restart: unless-stopped
  # images are pinned on purpose (CLAUDE.md): the host's Watchtower must never swap them
  labels: &no-watchtower
    com.centurylinklabs.watchtower.enable: "false"
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }   # docker's default keeps container logs forever

services:
  mysql:
    <<: *restart
    image: mysql:8.4.11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./runtime/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    <<: *restart
    image: redis:7.2.5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  emqx:
    <<: *restart
    image: emqx/emqx:5.8.6
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      # built-in user database, seeded from emqx/auth-bootstrap.csv (rendered by setup.sh)
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/auth-bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      # pilot accounts may only use the device side of the DJI topics (telemetry/emqx/acl.conf, ends with
      # {deny, all}). no_match stays "allow": with "deny", RCs reconnecting within the first seconds after an
      # EMQX restart (before the file source is active) lost their subscriptions (seen 2026-10-02).
    volumes:
      - ./runtime/emqx/auth-bootstrap.csv:/opt/emqx/etc/auth-bootstrap.csv:ro
      - ../telemetry/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./data/emqx:/opt/emqx/data
    ports:
      - "1884:1883"     # MQTT (Pilot 2 + backend); host 1883 taken by mosquitto
      - "8084:8083"     # MQTT over WebSocket (DRC); host 8083 taken by calibre-web
      - "127.0.0.1:18083:18083"   # EMQX dashboard, server only (ssh -L 18083:localhost:18083 ...)
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    <<: *restart
    # MinIO CE images/binaries are no longer published -> built from pinned source (evidence/docker/minio).
    # LAN use only, see README.
    build:
      context: ../evidence/docker/minio
    image: aeronexus/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # browser access (COG/PMTiles range requests, mapping layers) only from the web UI origin
      MINIO_API_CORS_ALLOW_ORIGIN: http://${SERVER_HOST}:8085
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"     # S3 API (Pilot 2 uploads directly here)
      - "127.0.0.1:9001:9001"     # MinIO console, server only (ssh -L 9001:localhost:9001 ...)

  minio-init:
    build:
      context: ../evidence/docker/minio
    image: aeronexus/minio:RELEASE.2025-10-15T17-29-55Z   # same image, bundles mc
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_STS_USER: ${MINIO_STS_USER}
      MINIO_STS_PASSWORD: ${MINIO_STS_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MAPPING_MINIO_USER: ${MAPPING_MINIO_USER}
      MAPPING_MINIO_PASSWORD: ${MAPPING_MINIO_PASSWORD}
      MAPPING_RESULTS_BUCKET: mapping-results
      MAPPING_BASEMAPS_BUCKET: basemaps
      FARMING_MINIO_USER: ${FARMING_MINIO_USER}
      FARMING_MINIO_PASSWORD: ${FARMING_MINIO_PASSWORD}
      FARMING_BUCKET: farming
      PV_MINIO_USER: ${PV_MINIO_USER}
      PV_MINIO_PASSWORD: ${PV_MINIO_PASSWORD}
      PV_BUCKET: pv-inspections
    volumes:
      - ../evidence/scripts/minio-init.sh:/init/minio-init.sh:ro
    depends_on:
      - minio
    restart: "no"
    logging: *logging
    labels: *no-watchtower

  mediamtx:
    <<: *restart
    image: bluenviron/mediamtx:1.15.1
    # host network: WebRTC ICE candidates then carry the real LAN IP
    network_mode: host
    environment:
      MTX_HLSALLOWORIGIN: http://${SERVER_HOST}:8085
      MTX_WEBRTCALLOWORIGIN: http://${SERVER_HOST}:8085
    volumes:
      - ../telemetry/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    depends_on:
      mapping:
        condition: service_healthy     # answers the stream auth requests

  api:
    <<: *restart
    build:
      context: ./runtime/upstream/backend
    image: aeronexus/api:local
    environment:
      SERVER_HOST: ${SERVER_HOST}
      # LAN defaults; TLS mode overrides these in docker-compose.override.yml (rendered by setup.sh)
      # BROKER_* not MQTT_*: Spring relaxed binding would map MQTT_X onto the mqtt.{BASIC,DRC} map and fail
      BROKER_PROTOCOL: MQTT
      BROKER_HOST: ${SERVER_HOST}
      BROKER_PORT: "1884"
      BROKER_PATH: ""
      DRC_PROTOCOL: WS
      DRC_HOST: ${SERVER_HOST}
      DRC_PORT: "8084"
      OSS_ENDPOINT: http://${SERVER_HOST}:9000
      WHIP_URL: http://${SERVER_HOST}:8889/live/{stream}/whip?user=${LIVE_PUBLISH_USER}&pass=${LIVE_PUBLISH_PASSWORD}
      RTMP_URL: rtmp://${SERVER_HOST}:1935/live/{stream}?user=${LIVE_PUBLISH_USER}&pass=${LIVE_PUBLISH_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BROKER_USER: ${MQTT_SERVER_USER}
      BROKER_PASSWORD: ${MQTT_SERVER_PASSWORD}
      MINIO_STS_USER: ${MINIO_STS_USER}
      MINIO_STS_PASSWORD: ${MINIO_STS_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      DJI_APP_ID: ${DJI_APP_ID}
      DJI_APP_KEY: ${DJI_APP_KEY}
      DJI_APP_LICENSE: ${DJI_APP_LICENSE}
      RTSP_USER: ${RTSP_USER}
      RTSP_PASSWORD: ${RTSP_PASSWORD}
      NTP_SERVER: ${NTP_SERVER}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: Europe/Berlin
    volumes:
      - ../api/docker/application.yml:/app/config/application.yml:ro
      - ./logs:/app/logs
    ports:
      - "6789:6789"     # HTTP API + WebSocket (/api/v1/ws)
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mapping-db-init:
    # creates the restricted MySQL user of the mapping service (idempotent, every start)
    image: mysql:8.4.11
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MAPPING_DB_PASSWORD: ${MAPPING_DB_PASSWORD}
    volumes:
      - ../mapping-tool/service/db-init/init.sh:/init/init.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    logging: *logging
    labels: *no-watchtower

  mapping:
    <<: *restart
    # AeroNexus Mapping Tool: jobs, compute-agent API, map layers (mapping-tool/docs/adr-001-architektur.md)
    build:
      context: ../mapping-tool/service
    image: aeronexus/mapping:local
    environment:
      SERVER_HOST: ${SERVER_HOST}
      MYSQL_USER: mapping
      MYSQL_PASSWORD: ${MAPPING_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAPPING_AGENT_TOKEN: ${MAPPING_AGENT_TOKEN}
      PRESIGN_TTL_SECONDS: ${PRESIGN_TTL_SECONDS}
      MAPPING_MINIO_USER: ${MAPPING_MINIO_USER}
      MAPPING_MINIO_PASSWORD: ${MAPPING_MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # presigned URLs must use an address the x64 agent and browsers can reach, never a docker hostname
      MINIO_PUBLIC_ENDPOINT: ${SERVER_HOST}:9000
      WOL_MAC: ${WOL_MAC}
      LIVE_PUBLISH_USER: ${LIVE_PUBLISH_USER}
      LIVE_PUBLISH_PASSWORD: ${LIVE_PUBLISH_PASSWORD}
      RTSP_USER: ${RTSP_USER}
      RTSP_PASSWORD: ${RTSP_PASSWORD}
      WEB_ORIGIN: http://${SERVER_HOST}:8085
      WOL_BROADCAST: ${WOL_BROADCAST}
      TZ: Europe/Berlin
    volumes:
      - mapping-cache:/cache       # media thumbnails (regenerated on demand if lost)
    ports:
      - "6790:6790"     # mapping API (web UI + compute agent)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6790/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mapping-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  farming:
    <<: *restart
    # AeroNexus Farming Guide: zone maps from vegetation index layers, Shapefile/KML/GeoJSON/ISO-XML export
    build:
      context: ../farming-guide/service
    image: aeronexus/farming:local
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MAPPING_URL: http://mapping:6790
      AWS_S3_ENDPOINT: minio:9000
      AWS_ACCESS_KEY_ID: ${FARMING_MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${FARMING_MINIO_PASSWORD}
      AWS_REGION: us-east-1
      WEB_ORIGIN: http://${SERVER_HOST}:8085
      TZ: Europe/Berlin
    ports:
      - "6791:6791"     # farming API (web UI)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6791/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mapping:
        condition: service_healthy

  pv:
    <<: *restart
    # AeroNexus Photovoltaik Tool: thermal inspections (hot spots in DJI R-JPEGs of M3T/M4T)
    build:
      context: ../photovoltaik-tool/service
    image: aeronexus/pv:local
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MAPPING_URL: http://mapping:6790
      AWS_S3_ENDPOINT: minio:9000
      AWS_ACCESS_KEY_ID: ${PV_MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${PV_MINIO_PASSWORD}
      AWS_REGION: us-east-1
      MINIO_BUCKET: ${MINIO_BUCKET}
      PV_BUCKET: pv-inspections
      WEB_ORIGIN: http://${SERVER_HOST}:8085
      TSDK_URL: http://tsdk:6793
      TZ: Europe/Berlin
    ports:
      - "6792:6792"     # pv API (web UI)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6792/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mapping:
        condition: service_healthy
      tsdk:
        condition: service_started

  tsdk:
    <<: *restart
    # DJI Thermal SDK runner for pv (x64 only from DJI: Box64 on the Pi, native on x64). Internal, no port.
    build:
      context: ../photovoltaik-tool/tsdk
    image: aeronexus/tsdk:local
    volumes:
      # DJI Thermal SDK (proprietary, not in the repo): photovoltaik-tool/tools/install-tsdk.sh
      - ./runtime/dji-tsdk:/opt/dji-tsdk:ro

  control:
    <<: *restart
    build:
      context: ./runtime/upstream/web
      args:
        VITE_DJI_APP_ID: ${DJI_APP_ID}
        VITE_DJI_APP_KEY: ${DJI_APP_KEY}
        VITE_DJI_APP_LICENSE: ${DJI_APP_LICENSE}
        VITE_BASE_URL: http://${SERVER_HOST}:6789/
        VITE_WS_URL: ws://${SERVER_HOST}:6789/api/v1/ws
        VITE_MAPPING_URL: http://${SERVER_HOST}:6790/
        VITE_FARMING_URL: http://${SERVER_HOST}:6791/
        VITE_PV_URL: http://${SERVER_HOST}:6792/
        VITE_RTMP_URL: rtmp://${SERVER_HOST}:1935/live/
        VITE_WHEP_BASE: http://${SERVER_HOST}:8889/
        VITE_HLS_BASE: http://${SERVER_HOST}:8888/
        VITE_RTSP_USER: ${RTSP_USER}
        VITE_RTSP_PASSWORD: ${RTSP_PASSWORD}
        VITE_MAP_CENTER: ${MAP_CENTER}
        VITE_MAP_ZOOM: ${MAP_ZOOM}
        VITE_MAP_TILE_URL: ${MAP_TILE_URL}
        # offline vector basemap served by this container (empty = online tiles only)
        VITE_MAP_PMTILES_URL: ${MAP_PMTILES_URL:-}
        VITE_MAP_ORTHO_PMTILES_URL: ${MAP_ORTHO_PMTILES_URL:-}
    image: aeronexus/control:local
    volumes:
      - ./data/basemaps:/usr/share/nginx/basemaps:ro   # mapping-tool/basemaps/fetch-basemap.sh
    ports:
      - "8085:80"       # Web UI + Pilot 2 login page (/pilot-login); host 8080 taken by nextcloud-aio
    depends_on:
      - api

volumes:
  mapping-cache:
